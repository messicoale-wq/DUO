name: duo
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install curl_cffi
    - run: python duo.py
      env:
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT }}
