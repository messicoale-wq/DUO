# force reindex dispatch registry
name: duo
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: duo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install curl_cffi
    - run: python duo.py
      env:
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT }}
        WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
        WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
